name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: notes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/notes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix frontend && npm ci --prefix backend
      - run: npm run check
      - run: npm run build:fe
      - run: npm run build:be
      - run: npm test
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and smoke test FE and BE containers
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 5 --retry-delay 1 http://localhost:3000/api/health
          curl --fail http://localhost:3000/runtime-config.json
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
