name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-only-postgres
          POSTGRES_DB: delta_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_INTEGRATION: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: delta_notes
      PGUSER: postgres
      PGPASSWORD: integration-only-postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run build:fe
      - run: npm run build:be
      - run: npm test
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and smoke test FE and BE containers
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 5 --retry-delay 1 http://localhost:3000/api/health
          curl --fail http://localhost:3000/runtime-config.json
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
