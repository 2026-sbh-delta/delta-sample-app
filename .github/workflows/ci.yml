name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    # CI 전용 값. 작업 단위로 둬야 정리 단계(docker compose down)도 같은 값을 받는다.
    env:
      POSTGRES_PASSWORD: ci-only-compose
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke test web and DB containers
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 5 --retry-delay 1 http://localhost:8080/healthz
          curl --fail -o /dev/null http://localhost:8080/board
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down -v
