services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정해야 한다}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-delta-sample-web:local}
    build: .
    environment:
      DATABASE_URL: postgresql://board:${POSTGRES_PASSWORD}@db:5432/board
      SERVED_BY: ${SERVED_BY:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      MIGRATE_ON_START: "1"
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

volumes:
  db-data:
