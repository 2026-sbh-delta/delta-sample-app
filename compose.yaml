services:
  db:
    # 개발·스테이징 공통 기준 PostgreSQL 16(GCP 스테이징 Cloud SQL POSTGRES_16). 운영 DB 버전은 아직 정하지 않았다.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정해야 한다}
    volumes:
      # 주요 버전이 다른 데이터 디렉터리는 열 수 없다. 17 시절 볼륨(db-data)은 그대로 두고 새 볼륨을 쓴다.
      - db-data-pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-delta-sample-web:local}
    build: .
    environment:
      DATABASE_URL: postgresql://board:${POSTGRES_PASSWORD}@db:5432/board
      SERVED_BY: ${SERVED_BY:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      MIGRATE_ON_START: "1"
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

volumes:
  db-data-pg16:
