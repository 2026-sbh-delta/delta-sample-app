services:
  backend:
    image: ${BE_IMAGE:-delta-sample-backend:local}
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: ${BE_PORT:-8080}
      API_ENDPOINT: ${API_ENDPOINT:-/api}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:${BE_PORT:-8080}"
    init: true
    restart: unless-stopped

  frontend:
    image: ${FE_IMAGE:-delta-sample-frontend:local}
    build:
      context: ./frontend
    environment:
      HOST: 0.0.0.0
      PORT: ${FE_PORT:-3000}
      API_HOST: ${API_HOST:-backend}
      API_PORT: ${API_PORT:-${BE_PORT:-8080}}
      API_PROTOCOL: ${API_PROTOCOL:-http}
      API_ENDPOINT: ${API_ENDPOINT:-/api}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-5000}
      APP_NAME: ${APP_NAME:-Delta Notes}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${FE_PORT:-3000}:${FE_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
